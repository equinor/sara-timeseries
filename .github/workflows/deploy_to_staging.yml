name: Deploy to Staging

concurrency:
  group: staging-concurrency
  cancel-in-progress: true

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: equinor/armada/.github/workflows/deploy_to_staging.yml@main
    with:
      registry: roboticsstagingacr.azurecr.io
      image_name: robotics/sara-timeseries
      push_to_ghcr: true
      tag: ${{ github.event.release.tag_name }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
      author_name: ${{ github.event.release.author.login }}
      # Authenticate to the registry with a federated credential instead
      # of the registry password. The environment below is what the OIDC
      # subject binds to on the Azure side.
      environment: Staging
      use_oidc: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      registry_username: ${{ secrets.ROBOTICS_ROBOTICSSTAGINGACR_USERNAME }}
      registry_password: ${{ secrets.ROBOTICS_ROBOTICSSTAGINGACR_PASSWORD }}
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
